# Pod를 생성할 때는 v1이라고 기재한다. (공식 문서)
apiVersion: v1
# Pod를 생성한다고 명시
kind: Pod

metadata:
  # Pod에 이름 붙이는 기능
  name: nginx-pod

spec:
  containers:
    - name: nginx-container # 생성할 컨테이너의 이름
      image: nginx:latest # 컨테이너를 생성할 때 사용할 Docker 이미지
      ports:
        # 해당 컨테이너가 어떤 포트를 사용하는 지 명시적으로 표현(참고용 - 문서)
        - containerPort: 80
