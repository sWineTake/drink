# kubectl apply -f  infra/infra-study/mysql/mysql-deployment.yaml
# kubectl rollout restart deployment mysql-deployment
apiVersion: apps/v1
kind: Deployment

metadata:
  name: mysql-deployment

spec:
  replicas: 1
  selector:
    matchLabels:
      app: mysql-db

  template:
    metadata:
      labels:
        app: mysql-db
    spec:
      containers:
        - name: mysql-container
          image: mysql
          ports:
            - containerPort: 3306
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: mysql-root-password
            - name: MYSQL_DATABASE
              valueFrom:
                configMapKeyRef:
                  name: mysql-config
                  key: mysql-database
          volumeMounts: # PVC연결한 뒤 저장경로 설정
            - mountPath: /var/lib/mysql
              name: mysql-persistent-storage
      volumes: # Deployment에서는 PV다이렉트로 연결하지못하여 PVC를 연결한다.
        - name: mysql-persistent-storage
          persistentVolumeClaim:
            claimName: mysql-pvc
