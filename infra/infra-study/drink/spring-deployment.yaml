# Deployment를 실행
# kubectl apply -f infra/infra-study/drink/spring-deployment.yaml
# Deployment 재실행
# kubectl rollout restart deployment <metadata.name>

apiVersion: apps/v1
kind: Deployment

metadata:
  name: spring-deployment

# Deployment 세부 정보
spec:
  replicas: 5
  selector:
    matchLabels:
      app: backend-app

  # 배포할 Pod 정의
  template:
    metadata:
      labels: # 파드에 카테고리
        app: backend-app

    spec:
      containers:
        - name: spring-container
          image: user-service-spring-server
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8081

          env:
            - name: MY_ACCOUNT
              valueFrom:
                configMapKeyRef:
                  name: spring-config
                  key: my-account
            - name: MY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: spring-secret
                  key: my-password
