# Deployment를 실행
# kubectl apply -f infra/infra-study/drink/spring-deployment.yaml
# Deployment 재실행
# kubectl rollout restart deployment <metadata.name>

apiVersion: apps/v1
kind: Deployment

metadata:
  name: spring-deployment

# Deployment 세부 정보
spec:
  replicas: 3
  selector:
    matchLabels:
      app: backend-app

  # 배포할 Pod 정의
  template:
    metadata:
      labels: # 파드에 카테고리
        app: backend-app

    spec:
      containers:
        - name: spring-container
          image: user-service-spring-server
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8081

          env:
            - name: DB_HOST
              value: mysql-service # infra/infra-study/mysql/mysql-service.yaml 파일에 metadata.name과 연결할 수 있음
            - name: DB_PORT
              value: "3306"
            - name: DB_NAME
              value: kub-practice
            - name: DB_USERNAME
              value: root
            - name: DB_PASSWORD
              value: password123
            - name: MY_ACCOUNT
              valueFrom:
                configMapKeyRef:
                  name: spring-config
                  key: my-account
            - name: MY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: spring-secret
                  key: my-password
