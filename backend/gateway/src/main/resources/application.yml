server:
  port: 8080

spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      routes:
        # User Service - 인증 불필요 (회원가입, 로그인)
        - id: user-service-public
          uri: http://localhost:8081
          predicates:
            - Path=/api/users/**
            - Method=POST

        # User Service - 인증 필요
        # - id: user-service
        #   uri: http://localhost:8081
        #   predicates:
        #     - Path=/api/users/**
        #   filters:
        #     - JwtAuthenticationFilter

        # Recipe Service
        - id: recipe-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/recipes/**

        # Comment Service
        - id: comment-service
          uri: http://localhost:8083
          predicates:
            - Path=/api/comments/**

      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials

management:
  endpoints:
    web:
      exposure:
        include: health, info, gateway
  endpoint:
    gateway:
      enabled: true

logging:
  level:
    org.springframework.cloud.gateway: DEBUG

